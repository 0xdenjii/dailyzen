version: '3.8'

services:
  postgres:
    image: postgres:16-alpine 
    container_name: dailyzen_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dailyzen
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: dailyzen_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres 
    restart: unless-stopped

volumes:
  postgres_data: 