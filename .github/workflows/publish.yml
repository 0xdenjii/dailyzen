name: Backend CD - Publish Docker Image

on:
  push:
    branches: [ "main" ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Backend Image to GHCR
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dailyzen
        # We give the service a network alias `postgres`
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dailyzen:latest
          build-args: |
            # --- THIS IS THE CRITICAL FIX ---
            # Inside the Docker build, the service container is NOT on `localhost`.
            # By default, Docker gives it a hostname equal to the service name: `postgres`.
            # We must use that hostname to connect. The port is the internal Docker port.
            DATABASE_URL=postgres://user:password@postgres:5432/dailyzen