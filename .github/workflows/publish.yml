name: Backend CD - Publish Docker Image

on:
  push:
    branches: [ "main" ]
    # Only run this workflow if changes were made within the `backend` directory.
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Backend Image to GHCR
    runs-on: ubuntu-latest

    # The service container remains the same.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dailyzen
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # CRITICAL FOR MONOREPO: The context is the root of the repository.
          # This ensures that `COPY backend/` in the Dockerfile works correctly.
          context: .
          # CRITICAL FOR MONOREPO: We point to the Dockerfile inside the backend directory.
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dailyzen:latest
          build-args: |
            DATABASE_URL=postgres://user:password@localhost:5432/dailyzen
          # no-cache: true