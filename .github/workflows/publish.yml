name: Publish Docker Image

# This workflow runs ONLY on pushes to the `main` branch.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering

# These permissions are required for pushing to the GitHub Container Registry.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Image to GHCR
    runs-on: ubuntu-latest

    # We need a PostgreSQL database for the `cargo sqlx prepare` step during the Docker build.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dailyzen
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dailyzen:latest
          # This is the most critical part: We pass the DATABASE_URL for the service container
          # into the Docker build process as a build argument. The Dockerfile's `ARG DATABASE_URL`
          # receives this value, allowing `cargo sqlx prepare` to work.
          build-args: |
            DATABASE_URL=postgres://user:password@localhost:5432/dailyzen