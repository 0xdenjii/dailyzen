name: Backend CI - Test Suite

on:
  push:
    branches: [ "**" ]
    # Only run this workflow if changes were made within the `backend` directory.
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest

    # This service container remains the same.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dailyzen
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          # The path is now relative to the repository root.
          path: |
            backend/target/
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          # The key now specifically looks for the backend's Cargo.lock.
          key: ${{ runner.os }}-cargo-backend-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        # We specify the working directory for this and all subsequent steps.
        working-directory: ./backend
        run: |
          if ! command -v sqlx &> /dev/null
          then
            cargo install sqlx-cli --version 0.7.4
          fi


      - name: Run Migrations
        working-directory: ./backend
        run: sqlx migrate run
        env:
          DATABASE_URL: "postgres://user:password@localhost:5432/dailyzen"

      - name: Run Tests
        working-directory: ./backend
        run: cargo test --all-targets --all-features
        env:
          DATABASE_URL: "postgres://user:password@localhost:5432/dailyzen"