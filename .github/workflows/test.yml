name: Backend CI - Test Suite

on:
  push:
    branches: [ "**" ]
    paths: [ 'backend/**' ]
  pull_request:
    branches: [ "main" ]
    paths: [ 'backend/**' ]

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dailyzen
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo dependencies
        uses: actions/cache@vv4
        with:
          path: |
            backend/target/
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-backend-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # --- THIS IS THE FIX ---
      # Add `--force` to the install command. This makes the step idempotent.
      # If the binary is already in the cache, it will simply be overwritten.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.7.4 --locked --force

      - name: Run Migrations
        working-directory: ./backend
        # We use the globally installed `sqlx` command.
        run: sqlx migrate run
        env:
          DATABASE_URL: "postgres://user:password@localhost:5432/dailyzen"

      - name: Run Tests
        working-directory: ./backend
        run: cargo test --all-targets --all-features
        env:
          DATABASE_URL: "postgres://user:password@localhost:5432/dailyzen"
